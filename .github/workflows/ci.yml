name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.10"
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - name: Validate main stack
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate
      - name: Validate bootstrap stack
        working-directory: terraform/bootstrap
        run: |
          terraform init -backend=false
          terraform validate

  checkov:
    name: Checkov policy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
      # The optional OIDC deploy roles are switched off by default (count = 0), and Checkov
      # does not check resources that do not exist. Scan them once more with the switch on.
      - name: Checkov with the optional OIDC deploy roles switched on
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/bootstrap
          framework: terraform
          quiet: true
          var_file: .github/checkov/bootstrap-oidc-on.tfvars.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
